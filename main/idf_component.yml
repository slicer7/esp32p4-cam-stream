dependencies:
  idf: ">=5.5"

  # V4L2-style camera stack for ESP32-P4 (MIPI-CSI + ISP).
  # Pulls in espressif/esp_cam_sensor, which contains the OV5647 driver.
  espressif/esp_video: "*"

  # Wi-Fi on the ESP32-P4 comes from the on-board ESP32-C6 over SDIO.
  # esp_wifi_remote gives the normal esp_wifi_* API and pulls espressif/esp_hosted
  # (the SDIO transport) itself on esp32p4, so do not list esp_hosted separately.
  #
  # NOTE: esp_wifi_remote's Kconfig does `orsource "./Kconfig.idf_v$ESP_IDF_VERSION.in"`.
  # ESP_IDF_VERSION is exported by IDF's activation script, NOT by the CMake build.
  # Build from an unactivated shell and that orsource silently resolves to nothing,
  # leaving CONFIG_WIFI_RMT_* undefined and the build failing inside esp_hosted's
  # eh_host_wifi.c. The fix is the environment, not this file.
  espressif/esp_wifi_remote: "*"
